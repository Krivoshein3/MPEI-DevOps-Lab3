name: mpei-devops-lab3

services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_DB: moscow_events
      POSTGRES_USER: postgres
      # Учебный пароль для локального запуска, не для публичного сервера.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lab3_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moscow_events"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    image: ghcr.io/nelkor/moscow-events:1.0.0
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_DB_NAME: moscow_events
      PG_USER_NAME: postgres
      PG_USER_PASSWORD: ${DB_PASSWORD:-lab3_local_password}
      SEED_MODE: sample
    depends_on:
      db:
        condition: service_healthy
    # В образе есть healthcheck: запрос к /health/ready.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
